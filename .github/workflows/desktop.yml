name: Desktop builds

# Builds installers for macOS, Windows and Linux.
# Runs when a version tag is pushed (e.g. v0.2.0) or manually from the Actions tab.
# macOS runners use 10x the minutes of Linux on private repos, so this doesn't run on every push.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:${{ matrix.target }}
        env:
          # No signing certificates are configured; build unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Player-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
