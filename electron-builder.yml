appId: com.bluemoon1337.player
productName: Player
copyright: Copyright © 2026 BlueMoon1337
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - "!dist-electron/*.map"
  - package.json
asar: true

mac:
  category: public.app-category.music
  # Ad-hoc signed (no Apple Developer ID): without a signature at all, Apple silicon Macs report
  # the app as damaged. The hardened runtime is only needed for notarization, and with ad-hoc
  # signing it would reject Electron's own pre-signed frameworks, so it's off.
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [universal]
    # What the Update button downloads and unpacks.
    - target: zip
      arch: [universal]
  extendInfo:
    # Only used if you click "Show all audio devices" to list interfaces by name.
    NSMicrophoneUsageDescription: Player asks for audio access only to list your audio interfaces by name. It never records.
    # The console button finds X32 mixing consoles on the local network and mutes a channel on one.
    NSLocalNetworkUsageDescription: Player looks for your mixing console on the local network, so the console button can mute and unmute a channel on it.

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  # No spaces: GitHub renames release files with spaces, and the updater looks them up by name.
  artifactName: Player-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Audio
  syncDesktopName: true
  target: [AppImage]
